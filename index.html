<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover" />
    <title>奇妙小馆</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet" />
    <style>
        /* ===== 样式全部保留 ===== */
        :root {
            --cream: #FDF6ED;
            --warm-bg: #FAF0E6;
            --brown-dark: #3D2C1E;
            --brown-mid: #8B6F4C;
            --brown-light: #C4A882;
            --coral: #E8846A;
            --coral-light: #F5B8A8;
            --gold: #F0C27A;
            --gold-light: #F9E0B0;
            --mint: #9DC6B5;
            --mint-light: #D4EBE0;
            --shadow: 0 6px 24px rgba(61, 44, 30, 0.12);
            --radius: 28px;
            --radius-sm: 16px;
            --font-serif: 'Noto Serif SC', 'PingFang SC', 'Microsoft YaHei', serif;
            --font-fun: 'ZCOOL KuaiLe', 'PingFang SC', 'Microsoft YaHei', cursive;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            height: 100%;
            font-family: var(--font-serif);
            background: #e8d5c4;
            color: var(--brown-dark);
            overflow: hidden;
            touch-action: manipulation;
            -webkit-font-smoothing: antialiased;
        }

        #app {
            max-width: 480px;
            margin: 0 auto;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            background: var(--cream);
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 60px rgba(61, 44, 30, 0.12);
            border-radius: 0;
        }

        @media (min-width: 481px) {
            #app {
                border-radius: 28px;
                margin-top: 16px;
                margin-bottom: 16px;
                height: calc(100vh - 32px);
                height: calc(100dvh - 32px);
            }
        }

        .page {
            display: none;
            flex: 1;
            flex-direction: column;
            padding: 20px 22px 80px;
            overflow-y: auto;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
            animation: fadeIn 0.35s ease;
            will-change: transform, opacity;
        }
        .page.active {
            display: flex;
        }

        @keyframes fadeIn {
            0% {
                opacity: 0;
                transform: translateY(12px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pop {
            0% {
                transform: scale(0.8);
                opacity: 0;
            }
            60% {
                transform: scale(1.05);
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .page::-webkit-scrollbar {
            width: 4px;
        }
        .page::-webkit-scrollbar-track {
            background: transparent;
        }
        .page::-webkit-scrollbar-thumb {
            background: var(--brown-light);
            border-radius: 10px;
        }

        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 0 18px;
            flex-shrink: 0;
        }
        .page-header .back-btn {
            width: 44px;
            height: 44px;
            border: none;
            background: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: background 0.2s;
            flex-shrink: 0;
            -webkit-user-select: none;
            user-select: none;
        }
        .page-header .back-btn:hover {
            background: rgba(61, 44, 30, 0.06);
        }
        .page-header .back-btn:active {
            transform: scale(0.92);
        }
        .page-header .page-title {
            font-family: var(--font-fun);
            font-size: 22px;
            color: var(--brown-dark);
            letter-spacing: 1px;
            -webkit-user-select: none;
            user-select: none;
        }
        .page-header .spacer {
            width: 44px;
            flex-shrink: 0;
        }

        /* ===== 首页 ===== */
        #home .home-hero {
            text-align: center;
            padding: 18px 0 10px;
            flex-shrink: 0;
        }
        #home .home-hero .hero-icon {
            display: flex;
            justify-content: center;
            margin-bottom: 6px;
        }
        #home .home-hero h1 {
            font-family: var(--font-fun);
            font-size: 36px;
            color: var(--brown-dark);
            letter-spacing: 2px;
            line-height: 1.2;
        }
        #home .home-hero h1 span {
            color: var(--coral);
        }
        #home .home-hero p {
            color: var(--brown-mid);
            font-size: 15px;
            margin-top: 4px;
            letter-spacing: 2px;
        }

        .card-grid {
            display: flex;
            flex-direction: column;
            gap: 16px;
            padding: 12px 0 8px;
            flex: 1;
        }
        .card-grid .card {
            background: white;
            border-radius: var(--radius);
            padding: 18px 22px;
            display: flex;
            align-items: center;
            gap: 18px;
            box-shadow: var(--shadow);
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            border: 2px solid rgba(61, 44, 30, 0.06);
            min-height: 76px;
            -webkit-user-select: none;
            user-select: none;
        }
        .card-grid .card:active {
            transform: scale(0.97);
        }
        .card-grid .card .card-icon {
            flex-shrink: 0;
            width: 52px;
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: var(--radius-sm);
            background: var(--warm-bg);
            pointer-events: none;
        }
        .card-grid .card .card-info {
            flex: 1;
            min-width: 0;
            pointer-events: none;
        }
        .card-grid .card .card-info h3 {
            font-family: var(--font-fun);
            font-size: 18px;
            color: var(--brown-dark);
            letter-spacing: 0.5px;
        }
        .card-grid .card .card-info p {
            font-size: 13px;
            color: var(--brown-mid);
            margin-top: 1px;
        }
        .card-grid .card .card-arrow {
            flex-shrink: 0;
            color: var(--brown-light);
            opacity: 0.5;
            pointer-events: none;
        }
        .card-grid .card:nth-child(1) .card-icon {
            background: #FDE8E0;
        }
        .card-grid .card:nth-child(2) .card-icon {
            background: #E6F0EA;
        }
        .card-grid .card:nth-child(3) .card-icon {
            background: #FCF3DD;
        }

        /* ===== 闲聊小桌（原便签页） ===== */
        .note-input-area {
            display: flex;
            gap: 10px;
            padding: 4px 0 16px;
            flex-shrink: 0;
        }
        .note-input-area input {
            flex: 1;
            padding: 14px 18px;
            border: 2px solid var(--brown-light);
            border-radius: var(--radius-sm);
            font-size: 15px;
            font-family: var(--font-serif);
            background: white;
            outline: none;
            transition: border 0.2s;
            color: var(--brown-dark);
            min-width: 0;
        }
        .note-input-area input:focus {
            border-color: var(--coral);
        }
        .note-input-area input::placeholder {
            color: var(--brown-light);
            font-size: 14px;
        }
        .note-input-area .add-btn {
            flex-shrink: 0;
            width: 52px;
            height: 52px;
            border: none;
            border-radius: var(--radius-sm);
            background: var(--coral);
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s, transform 0.15s;
            box-shadow: 0 4px 12px rgba(232, 132, 106, 0.3);
            -webkit-user-select: none;
            user-select: none;
        }
        .note-input-area .add-btn:active {
            transform: scale(0.92);
        }
        .note-input-area .add-btn.loading {
            opacity: 0.6;
            pointer-events: none;
        }

        .notes-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 4px 0 12px;
            flex: 1;
        }
        .notes-list .note-item {
            background: white;
            border-radius: var(--radius-sm);
            padding: 14px 18px;
            display: flex;
            align-items: center;
            gap: 14px;
            box-shadow: 0 2px 12px rgba(61, 44, 30, 0.06);
            border-left: 5px solid var(--gold);
            animation: pop 0.3s ease;
        }
        .notes-list .note-item:nth-child(2n) {
            border-left-color: var(--coral-light);
        }
        .notes-list .note-item:nth-child(3n) {
            border-left-color: var(--mint);
        }
        .notes-list .note-item .note-text {
            flex: 1;
            font-size: 15px;
            color: var(--brown-dark);
            word-break: break-word;
            line-height: 1.5;
            -webkit-user-select: none;
            user-select: none;
        }
        .notes-list .note-item .note-del {
            flex-shrink: 0;
            width: 36px;
            height: 36px;
            border: none;
            background: none;
            cursor: pointer;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
            color: var(--brown-light);
            -webkit-user-select: none;
            user-select: none;
        }
        .notes-list .note-item .note-del:active {
            transform: scale(0.88);
        }
        .notes-list .note-item .note-del:hover {
            background: rgba(61, 44, 30, 0.06);
            color: var(--coral);
        }
        .notes-list .note-item .note-del.loading {
            opacity: 0.4;
            pointer-events: none;
        }

        .notes-empty {
            text-align: center;
            color: var(--brown-light);
            padding: 40px 0;
            font-size: 15px;
            letter-spacing: 1px;
            -webkit-user-select: none;
            user-select: none;
        }
        .notes-empty svg {
            opacity: 0.3;
            margin-bottom: 12px;
        }

        .notes-loading {
            text-align: center;
            color: var(--brown-mid);
            padding: 40px 0;
            font-size: 14px;
            letter-spacing: 1px;
        }
        .notes-loading svg {
            animation: spin 1.2s linear infinite;
            margin-bottom: 12px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .notes-error {
            text-align: center;
            color: var(--coral);
            padding: 30px 0;
            font-size: 14px;
            letter-spacing: 1px;
        }
        .notes-error .retry-btn {
            margin-top: 12px;
            padding: 8px 24px;
            border: 2px solid var(--coral);
            border-radius: 20px;
            background: transparent;
            color: var(--coral);
            cursor: pointer;
            font-family: var(--font-serif);
            font-size: 14px;
            transition: background 0.2s;
        }
        .notes-error .retry-btn:hover {
            background: var(--coral);
            color: white;
        }

        /* ===== 时钟 ===== */
        .clock-display {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px 0 20px;
            gap: 20px;
            -webkit-user-select: none;
            user-select: none;
        }
        .clock-circle-wrap {
            position: relative;
            width: 240px;
            height: 240px;
            max-width: 70vw;
            max-height: 70vw;
            aspect-ratio: 1/1;
        }
        .clock-circle-wrap svg {
            width: 100%;
            height: 100%;
            display: block;
        }
        .clock-time-text {
            font-family: var(--font-fun);
            font-size: 52px;
            color: var(--brown-dark);
            letter-spacing: 4px;
            line-height: 1;
            margin-top: 4px;
        }
        .clock-date-text {
            font-size: 16px;
            color: var(--brown-mid);
            letter-spacing: 2px;
        }
        .clock-greeting {
            font-family: var(--font-fun);
            font-size: 20px;
            color: var(--coral);
            letter-spacing: 1px;
        }

        /* ===== 骰子 ===== */
        .dice-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px 0 20px;
            gap: 30px;
            -webkit-user-select: none;
            user-select: none;
        }
        .dice-box {
            width: 160px;
            height: 160px;
            max-width: 55vw;
            max-height: 55vw;
            aspect-ratio: 1/1;
            background: white;
            border-radius: 28px;
            box-shadow: var(--shadow), inset 0 -4px 0 rgba(61, 44, 30, 0.06);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.15s;
            cursor: pointer;
            border: 2px solid rgba(61, 44, 30, 0.06);
            touch-action: manipulation;
        }
        .dice-box:active {
            transform: scale(0.94);
        }
        .dice-box svg {
            width: 70%;
            height: 70%;
            display: block;
            pointer-events: none;
        }
        .dice-btn {
            padding: 14px 48px;
            border: none;
            border-radius: 40px;
            background: var(--gold);
            color: var(--brown-dark);
            font-family: var(--font-fun);
            font-size: 20px;
            letter-spacing: 2px;
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(240, 194, 122, 0.4);
            transition: transform 0.15s, box-shadow 0.2s;
            touch-action: manipulation;
            -webkit-user-select: none;
            user-select: none;
        }
        .dice-btn:active {
            transform: scale(0.94);
            box-shadow: 0 2px 8px rgba(240, 194, 122, 0.3);
        }
        .dice-history {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            padding-top: 8px;
            min-height: 44px;
            align-items: center;
        }
        .dice-history .dot-history {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--warm-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-fun);
            font-size: 16px;
            color: var(--brown-mid);
            border: 1px solid rgba(61, 44, 30, 0.06);
            animation: pop 0.3s ease;
        }

        /* ===== 底部导航 ===== */
        .bottom-nav {
            display: none;
            padding: 12px 22px 18px;
            flex-shrink: 0;
            background: white;
            border-top: 1px solid rgba(61, 44, 30, 0.05);
            justify-content: space-around;
            align-items: center;
            border-radius: 28px 28px 0 0;
            margin: 0 -4px;
            position: relative;
            z-index: 10;
        }
        .bottom-nav.show {
            display: flex;
        }
        .bottom-nav .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            background: none;
            border: none;
            cursor: pointer;
            color: var(--brown-light);
            transition: color 0.2s;
            padding: 4px 12px;
            font-family: var(--font-serif);
            font-size: 11px;
            touch-action: manipulation;
            -webkit-user-select: none;
            user-select: none;
        }
        .bottom-nav .nav-item.active {
            color: var(--brown-dark);
        }
        .bottom-nav .nav-item:active {
            transform: scale(0.92);
        }
        .bottom-nav .nav-item svg {
            display: block;
            pointer-events: none;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 420px) {
            .page {
                padding: 14px 16px 72px;
            }
            #home .home-hero h1 {
                font-size: 28px;
            }
            .card-grid .card {
                padding: 14px 16px;
                min-height: 64px;
            }
            .card-grid .card .card-icon {
                width: 44px;
                height: 44px;
            }
            .card-grid .card .card-info h3 {
                font-size: 16px;
            }
            .clock-circle-wrap {
                width: 200px;
                height: 200px;
            }
            .clock-time-text {
                font-size: 40px;
            }
            .dice-box {
                width: 130px;
                height: 130px;
            }
            .page-header .page-title {
                font-size: 19px;
            }
            .note-input-area input {
                font-size: 14px;
                padding: 12px 14px;
            }
            .note-input-area .add-btn {
                width: 48px;
                height: 48px;
            }
        }
        @media (max-width: 360px) {
            .page {
                padding: 10px 12px 64px;
            }
            #home .home-hero h1 {
                font-size: 24px;
            }
            .card-grid .card .card-info h3 {
                font-size: 14px;
            }
            .card-grid .card .card-info p {
                font-size: 12px;
            }
            .clock-circle-wrap {
                width: 160px;
                height: 160px;
            }
            .clock-time-text {
                font-size: 32px;
            }
            .dice-box {
                width: 110px;
                height: 110px;
            }
        }
        @supports (padding: max(0px)) {
            .page {
                padding-left: max(22px, env(safe-area-inset-left));
                padding-right: max(22px, env(safe-area-inset-right));
                padding-bottom: max(80px, env(safe-area-inset-bottom));
            }
            .bottom-nav {
                padding-bottom: max(18px, env(safe-area-inset-bottom));
            }
        }
    </style>
</head>
<body>
    <div id="app">

        <!-- ===== 首页 ===== -->
        <div id="home" class="page active">
            <div class="home-hero">
                <div class="hero-icon">
                    <svg width="60" height="60" viewBox="0 0 60 60" fill="none" aria-hidden="true">
                        <circle cx="30" cy="30" r="26" stroke="#E8846A" stroke-width="2.5" stroke-dasharray="4 4" />
                        <circle cx="30" cy="30" r="18" fill="#F5D9C8" stroke="#D4A574" stroke-width="2" />
                        <path d="M30 10 L30 50 M10 30 L50 30" stroke="#D4A574" stroke-width="2" stroke-linecap="round" />
                        <circle cx="30" cy="30" r="6" fill="#E8846A" />
                        <circle cx="30" cy="16" r="3" fill="#F0C27A" />
                        <circle cx="30" cy="44" r="3" fill="#F0C27A" />
                        <circle cx="16" cy="30" r="3" fill="#F0C27A" />
                        <circle cx="44" cy="30" r="3" fill="#F0C27A" />
                        <path d="M22 22 L38 38 M38 22 L22 38" stroke="#F0C27A" stroke-width="2" stroke-linecap="round" opacity="0.5" />
                    </svg>
                </div>
                <h1>奇妙<span>小馆</span></h1>
                <p>创意工具集合</p>
            </div>

            <div class="card-grid">
                <div class="card" data-page="notes" role="button" tabindex="0" aria-label="闲聊小桌">
                    <div class="card-icon" aria-hidden="true">
                        <svg width="30" height="30" viewBox="0 0 30 30" fill="none">
                            <rect x="4" y="4" width="20" height="22" rx="4" fill="#E8846A" opacity="0.15" stroke="#E8846A" stroke-width="2" />
                            <rect x="8" y="8" width="12" height="2" rx="1" fill="#E8846A" />
                            <rect x="8" y="12" width="10" height="2" rx="1" fill="#E8846A" />
                            <rect x="8" y="16" width="8" height="2" rx="1" fill="#E8846A" />
                        </svg>
                    </div>
                    <div class="card-info">
                        <h3>闲聊小桌</h3>
                        <p>大家说，一起聊</p>
                    </div>
                    <div class="card-arrow" aria-hidden="true">
                        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                            <path d="M7 4L13 10L7 16" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
                        </svg>
                    </div>
                </div>

                <div class="card" data-page="clock" role="button" tabindex="0" aria-label="创意时钟">
                    <div class="card-icon" aria-hidden="true">
                        <svg width="30" height="30" viewBox="0 0 30 30" fill="none">
                            <circle cx="15" cy="15" r="11" stroke="#9DC6B5" stroke-width="2.5" />
                            <circle cx="15" cy="15" r="3" fill="#9DC6B5" />
                            <path d="M15 10L15 15L19 17" stroke="#9DC6B5" stroke-width="2.5" stroke-linecap="round" />
                        </svg>
                    </div>
                    <div class="card-info">
                        <h3>创意时钟</h3>
                        <p>时间也可以很有趣</p>
                    </div>
                    <div class="card-arrow" aria-hidden="true">
                        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                            <path d="M7 4L13 10L7 16" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
                        </svg>
                    </div>
                </div>

                <div class="card" data-page="dice" role="button" tabindex="0" aria-label="幸运骰子">
                    <div class="card-icon" aria-hidden="true">
                        <svg width="30" height="30" viewBox="0 0 30 30" fill="none">
                            <rect x="4" y="4" width="22" height="22" rx="5" stroke="#F0C27A" stroke-width="2.5" fill="#FCF3DD" />
                            <circle cx="11" cy="11" r="2.5" fill="#F0C27A" />
                            <circle cx="19" cy="11" r="2.5" fill="#F0C27A" />
                            <circle cx="15" cy="15" r="2.5" fill="#F0C27A" />
                            <circle cx="11" cy="19" r="2.5" fill="#F0C27A" />
                            <circle cx="19" cy="19" r="2.5" fill="#F0C27A" />
                        </svg>
                    </div>
                    <div class="card-info">
                        <h3>幸运骰子</h3>
                        <p>试试你的今日运气</p>
                    </div>
                    <div class="card-arrow" aria-hidden="true">
                        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                            <path d="M7 4L13 10L7 16" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
                        </svg>
                    </div>
                </div>
            </div>
            <div style="text-align:center;padding:10px 0 4px;font-size:12px;color:var(--brown-light);letter-spacing:1px;flex-shrink:0;">
                点击卡片探索
            </div>
        </div>

        <!-- ===== 闲聊小桌 ===== -->
        <div id="notes" class="page">
            <div class="page-header">
                <button class="back-btn" data-back aria-label="返回首页">
                    <svg width="28" height="28" viewBox="0 0 28 28" fill="none" aria-hidden="true">
                        <path d="M18 6L8 14L18 22" stroke="#3D2C1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                </button>
                <span class="page-title">闲聊小桌</span>
                <span class="spacer"></span>
            </div>
            <div style="text-align:center;font-size:12px;color:var(--brown-light);letter-spacing:1px;margin-top:-10px;margin-bottom:6px;flex-shrink:0;">
                大家说，一起聊
            </div>
            <div class="note-input-area">
                <input type="text" id="noteInput" placeholder="说点什么..." maxlength="100" autocomplete="off" aria-label="输入留言" />
                <button class="add-btn" id="addNoteBtn" aria-label="发布留言">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" aria-hidden="true">
                        <path d="M12 4V20M4 12H20" />
                    </svg>
                </button>
            </div>
            <div class="notes-list" id="notesList"></div>
        </div>

        <!-- ===== 时钟页 ===== -->
        <div id="clock" class="page">
            <div class="page-header">
                <button class="back-btn" data-back aria-label="返回首页">
                    <svg width="28" height="28" viewBox="0 0 28 28" fill="none" aria-hidden="true">
                        <path d="M18 6L8 14L18 22" stroke="#3D2C1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                </button>
                <span class="page-title">创意时钟</span>
                <span class="spacer"></span>
            </div>
            <div class="clock-display">
                <div class="clock-circle-wrap" id="clockCanvas">
                    <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" aria-label="模拟时钟">
                        <circle cx="100" cy="100" r="88" stroke="#D4A574" stroke-width="2" fill="none" opacity="0.25" stroke-dasharray="6 6" />
                        <circle cx="100" cy="100" r="80" stroke="#D4A574" stroke-width="3" fill="white" />
                        <g id="clockTicks" stroke="#3D2C1E" stroke-width="2" stroke-linecap="round"></g>
                        <g id="clockNumbers" font-family="'ZCOOL KuaiLe', cursive" font-size="16" fill="#3D2C1E" text-anchor="middle" dominant-baseline="central"></g>
                        <g id="clockHands">
                            <line id="hourHand" x1="100" y1="100" x2="100" y2="60" stroke="#3D2C1E" stroke-width="4" stroke-linecap="round" />
                            <line id="minHand" x1="100" y1="100" x2="100" y2="44" stroke="#3D2C1E" stroke-width="2.5" stroke-linecap="round" />
                            <line id="secHand" x1="100" y1="100" x2="100" y2="38" stroke="#E8846A" stroke-width="1.5" stroke-linecap="round" />
                            <circle cx="100" cy="100" r="5" fill="#E8846A" />
                            <circle cx="100" cy="100" r="2.5" fill="white" />
                        </g>
                        <circle cx="100" cy="14" r="3" fill="#F0C27A" opacity="0.5" />
                        <circle cx="100" cy="186" r="3" fill="#F0C27A" opacity="0.5" />
                        <circle cx="14" cy="100" r="3" fill="#F0C27A" opacity="0.5" />
                        <circle cx="186" cy="100" r="3" fill="#F0C27A" opacity="0.5" />
                    </svg>
                </div>
                <div class="clock-time-text" id="clockTimeDisplay">--:--:--</div>
                <div class="clock-date-text" id="clockDateDisplay">----年--月--日</div>
                <div class="clock-greeting" id="clockGreeting">下午好</div>
            </div>
        </div>

        <!-- ===== 骰子页 ===== -->
        <div id="dice" class="page">
            <div class="page-header">
                <button class="back-btn" data-back aria-label="返回首页">
                    <svg width="28" height="28" viewBox="0 0 28 28" fill="none" aria-hidden="true">
                        <path d="M18 6L8 14L18 22" stroke="#3D2C1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                </button>
                <span class="page-title">幸运骰子</span>
                <span class="spacer"></span>
            </div>
            <div class="dice-area">
                <div class="dice-box" id="diceBox" role="button" tabindex="0" aria-label="点击掷骰子">
                    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" id="diceSvg" aria-hidden="true">
                        <rect x="2" y="2" width="96" height="96" rx="16" fill="white" stroke="#D4A574" stroke-width="2.5" />
                        <g id="diceDots" fill="#3D2C1E"></g>
                    </svg>
                </div>
                <button class="dice-btn" id="rollBtn">掷骰子</button>
                <div class="dice-history" id="diceHistory"></div>
            </div>
        </div>

        <!-- ===== 底部导航 ===== -->
        <nav class="bottom-nav show" id="bottomNav" aria-label="主导航">
            <button class="nav-item active" data-page="home" aria-label="首页">
                <svg width="26" height="26" viewBox="0 0 26 26" fill="none" aria-hidden="true">
                    <path d="M4 14L13 5L22 14" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
                    <rect x="6" y="12" width="14" height="10" rx="2" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round" />
                </svg>
                <span>首页</span>
            </button>
            <button class="nav-item" data-page="notes" aria-label="闲聊">
                <svg width="26" height="26" viewBox="0 0 26 26" fill="none" aria-hidden="true">
                    <rect x="4" y="4" width="16" height="18" rx="3" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round" />
                    <path d="M8 9H14M8 13H12M8 17H10" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" />
                </svg>
                <span>闲聊</span>
            </button>
            <button class="nav-item" data-page="clock" aria-label="时钟">
                <svg width="26" height="26" viewBox="0 0 26 26" fill="none" aria-hidden="true">
                    <circle cx="13" cy="13" r="9" stroke="currentColor" stroke-width="2.5" />
                    <circle cx="13" cy="13" r="2.5" fill="currentColor" />
                    <path d="M13 9V13L16 15" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" />
                </svg>
                <span>时钟</span>
            </button>
            <button class="nav-item" data-page="dice" aria-label="骰子">
                <svg width="26" height="26" viewBox="0 0 26 26" fill="none" aria-hidden="true">
                    <rect x="3" y="3" width="20" height="20" rx="4" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round" />
                    <circle cx="9" cy="9" r="2" fill="currentColor" />
                    <circle cx="17" cy="9" r="2" fill="currentColor" />
                    <circle cx="13" cy="13" r="2" fill="currentColor" />
                    <circle cx="9" cy="17" r="2" fill="currentColor" />
                    <circle cx="17" cy="17" r="2" fill="currentColor" />
                </svg>
                <span>骰子</span>
            </button>
        </nav>
    </div>

    <script type="module">
        // ============================================================
        //  Supabase REST API 直连（不依赖 SDK）
        // ============================================================
        const supabaseUrl = 'https://ibmrihlauhghtkqaynoa.supabase.co';
        const supabaseAnonKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlibXJpaGxhdWhnaHRrcWF5bm9hIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU0MTkxMDEsImV4cCI6MjEwMDk5NTEwMX0.mDiYXT-c3Ti9tBZIkAm2EW-ABLwx3HG9_7MfMq6HdCY';

        const API_URL = `${supabaseUrl}/rest/v1/notes`;
        const HEADERS = {
            'apikey': supabaseAnonKey,
            'Authorization': `Bearer ${supabaseAnonKey}`,
            'Content-Type': 'application/json',
            'Prefer': 'return=representation'
        };

        // ============================================================
        //  工具函数
        // ============================================================
        function getEl(id) { return document.getElementById(id); }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ===== DOM 引用 =====
        const pages = {
            home: getEl('home'),
            notes: getEl('notes'),
            clock: getEl('clock'),
            dice: getEl('dice'),
        };
        const bottomNav = getEl('bottomNav');
        const navItems = bottomNav ? bottomNav.querySelectorAll('.nav-item') : [];
        const notesList = getEl('notesList');
        const noteInput = getEl('noteInput');
        const addBtn = getEl('addNoteBtn');

        let currentPage = 'home';
        let isTransitioning = false;
        let notesData = [];
        let isLoading = false;

        // ============================================================
        //  Supabase 核心操作
        // ============================================================
        async function fetchNotes() {
            const resp = await fetch(API_URL, { 
                headers: HEADERS,
                mode: 'cors'
            });
            if (!resp.ok) throw new Error(`HTTP ${resp.status}: ${resp.statusText}`);
            return resp.json();
        }

        async function addNote(content) {
            const resp = await fetch(API_URL, {
                method: 'POST',
                headers: HEADERS,
                body: JSON.stringify([{ content }])
            });
            if (!resp.ok) throw new Error(`HTTP ${resp.status}: ${resp.statusText}`);
            return resp.json();
        }

        async function deleteNote(id) {
            const resp = await fetch(`${API_URL}?id=eq.${id}`, {
                method: 'DELETE',
                headers: HEADERS
            });
            if (!resp.ok) throw new Error(`HTTP ${resp.status}: ${resp.statusText}`);
        }

        // ============================================================
        //  便签渲染
        // ============================================================
        function renderNotes() {
            if (!notesList) return;

            if (isLoading) {
                notesList.innerHTML = `
                    <div class="notes-loading">
                        <svg width="40" height="40" viewBox="0 0 40 40" fill="none" aria-hidden="true">
                            <circle cx="20" cy="20" r="16" stroke="#C4A882" stroke-width="3" stroke-dasharray="24 24" stroke-linecap="round" />
                        </svg>
                        <div>加载留言中...</div>
                    </div>
                `;
                return;
            }

            if (!notesData || notesData.length === 0) {
                notesList.innerHTML = `
                    <div class="notes-empty">
                        <svg width="48" height="48" viewBox="0 0 48 48" fill="none" aria-hidden="true">
                            <rect x="8" y="8" width="28" height="30" rx="6" stroke="#C4A882" stroke-width="2.5" />
                            <rect x="14" y="14" width="16" height="2" rx="1" fill="#C4A882" opacity="0.4" />
                            <rect x="14" y="19" width="12" height="2" rx="1" fill="#C4A882" opacity="0.4" />
                            <rect x="14" y="24" width="10" height="2" rx="1" fill="#C4A882" opacity="0.4" />
                        </svg>
                        <div>还没有留言，来说第一句吧</div>
                    </div>
                `;
                return;
            }

            notesList.innerHTML = notesData.map(item => `
                <div class="note-item">
                    <span class="note-text">${escapeHtml(item.content)}</span>
                    <button class="note-del" data-id="${item.id}" aria-label="删除留言">
                        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
                            <path d="M5 5L15 15M15 5L5 15" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" />
                        </svg>
                    </button>
                </div>
            `).join('');

            notesList.querySelectorAll('.note-del').forEach(btn => {
                btn.addEventListener('click', async function(e) {
                    e.stopPropagation();
                    const id = this.dataset.id;
                    if (!id) return;
                    if (!confirm('确定要删除这条留言吗？')) return;
                    this.classList.add('loading');
                    try {
                        await deleteNote(id);
                        await loadNotes();
                    } catch (err) {
                        alert('删除失败: ' + err.message);
                        await loadNotes();
                    } finally {
                        this.classList.remove('loading');
                    }
                });
            });
        }

        // ============================================================
        //  加载 & 添加
        // ============================================================
        async function loadNotes() {
            if (isLoading) return;
            isLoading = true;
            renderNotes();
            try {
                notesData = await fetchNotes();
                renderNotes();
            } catch (err) {
                notesList.innerHTML = `
                    <div class="notes-error">
                        <div>加载失败: ${err.message}</div>
                        <button class="retry-btn" id="retryBtn">重试</button>
                    </div>
                `;
                const retryBtn = document.getElementById('retryBtn');
                if (retryBtn) retryBtn.addEventListener('click', loadNotes);
            } finally {
                isLoading = false;
            }
        }

        async function handleAddNote() {
            if (!noteInput) return;
            const text = noteInput.value.trim();
            if (text === '') return;
            if (isLoading) return;

            addBtn.classList.add('loading');
            try {
                await addNote(text);
                noteInput.value = '';
                await loadNotes();
                if (notesList) notesList.scrollTop = 0;
            } catch (err) {
                alert('发布失败: ' + err.message);
                await loadNotes();
            } finally {
                addBtn.classList.remove('loading');
                if (noteInput) noteInput.focus();
            }
        }

        // ============================================================
        //  页面切换
        // ============================================================
        function showPage(pageId) {
            if (isTransitioning) return;
            if (!pages[pageId]) return;
            if (currentPage === pageId && pages[pageId].classList.contains('active')) return;

            isTransitioning = true;
            Object.keys(pages).forEach(key => {
                pages[key].classList.remove('active');
            });
            const target = pages[pageId];
            target.classList.add('active');
            target.style.animation = 'none';
            void target.offsetWidth;
            target.style.animation = '';

            navItems.forEach(item => {
                item.classList.toggle('active', item.dataset.page === pageId);
            });

            if (pageId === 'home') {
                bottomNav.classList.add('show');
            } else {
                bottomNav.classList.remove('show');
            }

            currentPage = pageId;
            target.scrollTop = 0;

            if (pageId === 'notes') {
                loadNotes();
            }

            setTimeout(() => {
                isTransitioning = false;
            }, 360);
        }

        // ============================================================
        //  事件绑定
        // ============================================================
        document.querySelectorAll('.card[data-page]').forEach(card => {
            card.addEventListener('click', function(e) {
                e.preventDefault();
                const page = this.dataset.page;
                if (page) showPage(page);
            });
            card.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    const page = this.dataset.page;
                    if (page) showPage(page);
                }
            });
        });

        document.querySelectorAll('[data-back]').forEach(btn => {
            btn.addEventListener('click', function(e) {
                e.preventDefault();
                showPage('home');
            });
        });

        navItems.forEach(item => {
            item.addEventListener('click', function(e) {
                e.preventDefault();
                const page = this.dataset.page;
                if (page) showPage(page);
            });
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' && currentPage !== 'home') {
                showPage('home');
            }
        });

        if (addBtn) {
            addBtn.addEventListener('click', function(e) {
                e.preventDefault();
                handleAddNote();
            });
        }
        if (noteInput) {
            noteInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    handleAddNote();
                }
            });
        }

        // ============================================================
        //  时钟功能
        // ============================================================
        let clockInterval = null;

        function buildClockFace() {
            const ticks = getEl('clockTicks');
            const numbers = getEl('clockNumbers');
            if (!ticks || !numbers) return;
            let tickHtml = '';
            for (let i = 0; i < 12; i++) {
                const angle = (i / 12) * 360 - 90;
                const rad = (angle * Math.PI) / 180;
                const r1 = 70, r2 = 78;
                const x1 = 100 + r1 * Math.cos(rad);
                const y1 = 100 + r1 * Math.sin(rad);
                const x2 = 100 + r2 * Math.cos(rad);
                const y2 = 100 + r2 * Math.sin(rad);
                const isMain = i % 3 === 0;
                tickHtml += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#3D2C1E" stroke-width="${isMain ? 3 : 1.5}" stroke-linecap="round" />`;
            }
            ticks.innerHTML = tickHtml;
            let numHtml = '';
            for (let i = 1; i <= 12; i++) {
                const angle = (i / 12) * 360 - 90;
                const rad = (angle * Math.PI) / 180;
                const r = 58;
                const x = 100 + r * Math.cos(rad);
                const y = 100 + r * Math.sin(rad);
                numHtml += `<text x="${x}" y="${y}" font-size="15" fill="#3D2C1E" text-anchor="middle" dominant-baseline="central">${i}</text>`;
            }
            numbers.innerHTML = numHtml;
        }

        function updateClock() {
            const now = new Date();
            const h = now.getHours(), m = now.getMinutes(), s = now.getSeconds();
            const timeStr = String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
            const timeDisplay = getEl('clockTimeDisplay');
            if (timeDisplay) timeDisplay.textContent = timeStr;
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const weekdays = ['日', '一', '二', '三', '四', '五', '六'];
            const wd = weekdays[now.getDay()];
            const dateDisplay = getEl('clockDateDisplay');
            if (dateDisplay) dateDisplay.textContent = `${year}年${month}月${day}日 周${wd}`;
            let greeting = '夜深了';
            if (h >= 5 && h < 9) greeting = '早上好';
            else if (h >= 9 && h < 12) greeting = '上午好';
            else if (h >= 12 && h < 14) greeting = '中午好';
            else if (h >= 14 && h < 18) greeting = '下午好';
            else if (h >= 18 && h < 21) greeting = '傍晚好';
            else if (h >= 21 && h < 24) greeting = '晚上好';
            const greetingDisplay = getEl('clockGreeting');
            if (greetingDisplay) greetingDisplay.textContent = greeting;
            const hourDeg = (h % 12) * 30 + m * 0.5;
            const minDeg = m * 6 + s * 0.1;
            const secDeg = s * 6;
            const hourHand = getEl('hourHand');
            const minHand = getEl('minHand');
            const secHand = getEl('secHand');
            if (hourHand) hourHand.setAttribute('transform', `rotate(${hourDeg}, 100, 100)`);
            if (minHand) minHand.setAttribute('transform', `rotate(${minDeg}, 100, 100)`);
            if (secHand) secHand.setAttribute('transform', `rotate(${secDeg}, 100, 100)`);
        }

        function startClock() {
            buildClockFace();
            updateClock();
            if (clockInterval) clearInterval(clockInterval);
            clockInterval = setInterval(updateClock, 1000);
        }
        startClock();

        // ============================================================
        //  骰子功能
        // ============================================================
        let diceHistory = (function() {
            try {
                const v = localStorage.getItem('wonder_dice_history');
                return v ? JSON.parse(v) : [];
            } catch { return []; }
        })();

        const diceDotsMap = {
            1: [[50, 50]],
            2: [[30, 30], [70, 70]],
            3: [[30, 30], [50, 50], [70, 70]],
            4: [[30, 30], [70, 30], [30, 70], [70, 70]],
            5: [[30, 30], [70, 30], [50, 50], [30, 70], [70, 70]],
            6: [[30, 30], [70, 30], [30, 50], [70, 50], [30, 70], [70, 70]],
        };

        function renderDice(value) {
            const container = getEl('diceDots');
            if (!container) return;
            const dots = diceDotsMap[value] || diceDotsMap[1];
            container.innerHTML = dots.map(([cx, cy]) => `<circle cx="${cx}" cy="${cy}" r="8" fill="#3D2C1E" />`).join('');
        }

        function renderDiceHistory() {
            const container = getEl('diceHistory');
            if (!container) return;
            if (diceHistory.length === 0) {
                container.innerHTML = '<span style="color:var(--brown-light);font-size:13px;letter-spacing:1px;">还没有记录，掷一次吧</span>';
                return;
            }
            const recent = diceHistory.slice(-10).reverse();
            container.innerHTML = recent.map(val => `<span class="dot-history">${val}</span>`).join('');
        }

        function rollDice() {
            const val = Math.floor(Math.random() * 6) + 1;
            renderDice(val);
            diceHistory.push(val);
            if (diceHistory.length > 30) diceHistory = diceHistory.slice(-30);
            try { localStorage.setItem('wonder_dice_history', JSON.stringify(diceHistory)); } catch {}
            renderDiceHistory();
            const box = getEl('diceBox');
            if (box) {
                box.style.transition = 'transform 0.08s ease';
                box.style.transform = 'scale(0.85) rotate(8deg)';
                setTimeout(() => {
                    box.style.transform = 'scale(1.05) rotate(-4deg)';
                    setTimeout(() => {
                        box.style.transform = 'scale(1) rotate(0deg)';
                    }, 80);
                }, 80);
            }
        }

        const initVal = diceHistory.length > 0 ? diceHistory[diceHistory.length - 1] : 1;
        renderDice(initVal);
        renderDiceHistory();

        const rollBtn = getEl('rollBtn');
        const diceBox = getEl('diceBox');
        if (rollBtn) rollBtn.addEventListener('click', rollDice);
        if (diceBox) {
            diceBox.addEventListener('click', rollDice);
            diceBox.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); rollDice(); }
            });
        }

        // ============================================================
        //  启动应用
        // ============================================================
        showPage('home');

        document.querySelectorAll('button, .card, .dice-box, .nav-item, [role="button"]').forEach(el => {
            el.addEventListener('dblclick', function(e) { e.preventDefault(); }, { passive: false });
        });

        console.log('奇妙小馆已加载');
    </script>
</body>
</html>
